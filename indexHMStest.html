<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <title>Woningvoorraad Visualisatie</title>
    <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
    <style>
      body {
        font-family: sans-serif;
        padding: 2rem;
        background: #f9f9f9;
      }
      #vis {
        max-width: 900px;
        margin: auto;
      }
    </style>
  </head>
  <body>
    <h1>Woningvoorraad Heemstede</h1>
    <div id="vis"></div>

    <script>
      const specUrl = "https://raw.githubusercontent.com/GemeenteHMSBMD/cbs-data-heemstede-bloemendaal/main/WoningvoorraadHMS_BARS";

      vegaEmbed("#vis", specUrl, { actions: false }).catch(console.error);
    </script>
  </body>
</html>
