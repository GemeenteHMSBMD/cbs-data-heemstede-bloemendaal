<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <title>Heemstede Visualisaties</title>
    <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
    <style>
      body {
        font-family: "Segoe UI", sans-serif;
        background: #f4f4f4;
        margin: 0;
        padding: 2rem;
      }

      h1 {
        text-align: center;
        margin-bottom: 2rem;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
        gap: 2rem;
        max-width: 1200px;
        margin: auto;
      }

      .visual {
        background: white;
        border-radius: 12px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        padding: 1rem;
        transition: transform 0.3s ease;
      }

      .visual:hover {
        transform: scale(1.02);
      }

      /* Specifieke breedte-aanpassingen voor sommige visuals */
      #bouwjaar {
        max-width: 500px;
      }
    </style>
  </head>
  <body>
    <h1>Open Data Visualisaties – Heemstede</h1>
    <div class="grid">
      <div class="visual" id="piramide"></div>
      <div class="visual" id="groei"></div>
      <div class="visual" id="bouwjaar"></div>
      <div class="visual" id="woningvoorraad_bars"></div>
      <div class="visual" id="woningvoorraad_graph"></div>
    </div>

    <script type="text/javascript">
      vegaEmbed(
        "#piramide",
        "https://raw.githubusercontent.com/GemeenteHMSBMD/cbs-data-heemstede-bloemendaal/refs/heads/main/bevolkingspiramideHMS-spec.json",
        { actions: false }
      );

      vegaEmbed(
        "#groei",
        "https://raw.githubusercontent.com/GemeenteHMSBMD/cbs-data-heemstede-bloemendaal/refs/heads/main/BevolkingsgroeiHMS.json",
        { actions: false }
      );

      vegaEmbed(
        "#bouwjaar",
        "https://raw.githubusercontent.com/GemeenteHMSBMD/cbs-data-heemstede-bloemendaal/refs/heads/main/Aantal%20panden%20bouwjaar.json",
        { actions: false }
      );

      vegaEmbed(
        "#woningvoorraad_bars",
        "https://raw.githubusercontent.com/GemeenteHMSBMD/cbs-data-heemstede-bloemendaal/main/WoningvoorraadHMS_BARS",
        { actions: false }
      );

      vegaEmbed(
        "#woningvoorraad_graph",
        "https://raw.githubusercontent.com/GemeenteHMSBMD/cbs-data-heemstede-bloemendaal/refs/heads/main/WoningvoorraadHMS_Graph",
        { actions: false }
      );
    </script>
  </body>
</html>
