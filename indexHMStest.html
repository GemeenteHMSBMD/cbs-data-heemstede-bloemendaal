<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <title>Heemstede Visualisaties</title>
    <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
    <style>
      body {
        font-family: "Segoe UI", sans-serif;
        background: #f4f4f4;
        margin: 0;
        padding: 2rem;
      }

      h1 {
        text-align: center;
        margin-bottom: 2rem;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 2rem;
        max-width: 1200px;
        margin: auto;
      }

      .visual {
        background: white;
        border-radius: 12px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        padding: 1rem;
        transition: transform 0.3s ease;
        max-width: 100%;
        min-height: 300px;
      }

      .visual:hover {
        transform: scale(1.02);
      }

      .vega-embed {
        width: 100% !important;
        max-width: 100% !important;
        height: auto !important;
      }
    </style>
  </head>
  <body>
    <h1>Open Data Visualisaties – Heemstede</h1>
    <div class="grid">
      <div class="visual" id="piramide"></div>
      <div class="visual" id="groei"></div>
      <div class="visual" id="bouwjaar"></div>
      <div class="visual" id="woningvoorraad_bars"></div>
      <div class="visual" id="woningvoorraad_graph"></div>
    </div>

    <script type="text/javascript">
      const options = {
        actions: false,
        defaultStyle: true,
        renderer: "canvas",
        config: {
          view: { continuousWidth: 300, continuousHeight: 250 }
        }
      };

      // Inline JSON specificatie voor de piramide
      const specPiramide = {
        "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
        "width": 700,
        "height": 400,
        "data": {
          "url": "https://raw.githubusercontent.com/Jimvelthuis/cbs-data-heemstede-bloemendaal/main/VegaPyramideHMStab.txt",
          "format": {
            "type": "tsv",
            "parse": {
              "jaar": "number",
              "mannen": "number",
              "vrouwen": "number",
              "leeftijd": "number"
            }
          }
        },
        "transform": [
          {
            "filter": "jaar == 1988"
          },
          {
            "calculate": "-datum.mannen",
            "as": "_mannen"
          },
          {
            "calculate": "datum.jaar - datum.leeftijd",
            "as": "geboortejaar"
          },
          {
            "calculate": "datum.leeftijd > 99 ? datum.geboortejaar + ' en eerder' : datum.geboortejaar",
            "as": "_geboortejaartooltip"
          },
          {
            "calculate": "datum.leeftijd > 99 ? '+100' : datum.leeftijd",
            "as": "_leeftijdtooltip"
          },
          {
            "fold": ["_mannen", "vrouwen"],
            "as": ["geslacht", "aantal"]
          },
          {
            "calculate": "datum.geslacht == '_mannen' ? 'Mannen' : 'Vrouwen'",
            "as": "GeslachtLabel"
          },
          {
            "calculate": "abs(datum.aantal)",
            "as": "_aantalTooltip"
          }
        ],
        "encoding": {
          "y": {
            "field": "leeftijd",
            "type": "ordinal",
            "sort": "descending",
            "axis": {
              "title": "Leeftijd",
              "labelFontSize": 12,
              "labelFontWeight": "bold",
              "labelExpr": "datum.value % 10 === 0 ? datum.value : ''"
            }
          },
          "x": {
            "field": "aantal",
            "type": "quantitative",
            "axis": {
              "title": "Aantal personen",
              "format": ",d",
              "labelExpr": "abs(datum.value)"
            },
            "scale": { "domain": [-250, 250] }
          },
          "color": {
            "field": "GeslachtLabel",
            "type": "nominal",
            "scale": {
              "domain": ["Mannen", "Vrouwen"],
              "range": ["#a6cee3", "#1f78b4"]
            },
            "legend": {
              "title": "Geslacht",
              "orient": "top"
            }
          },
          "tooltip": [
            { "field": "_geboortejaartooltip", "title": "Geboortejaar" },
            { "field": "_leeftijdtooltip", "title": "Leeftijd" },
            { "field": "_aantalTooltip", "title": "Aantal" },
            { "field": "GeslachtLabel", "title": "Geslacht" }
          ]
        },
        "mark": {
          "type": "bar",
          "tooltip": true
        }
      };

      // Piramide inline embedden
      vegaEmbed("#piramide", specPiramide, options);

      // Andere visualisaties extern
      vegaEmbed(
        "#groei",
        "https://raw.githubusercontent.com/GemeenteHMSBMD/cbs-data-heemstede-bloemendaal/main/BevolkingsgroeiHMS.json",
        options
      );

      vegaEmbed(
        "#bouwjaar",
        "https://raw.githubusercontent.com/GemeenteHMSBMD/cbs-data-heemstede-bloemendaal/main/Aantal%20panden%20bouwjaar.json",
        options
      );

      vegaEmbed(
        "#woningvoorraad_bars",
        "https://raw.githubusercontent.com/GemeenteHMSBMD/cbs-data-heemstede-bloemendaal/main/WoningvoorraadHMS_BARS",
        options
      );

      vegaEmbed(
        "#woningvoorraad_graph",
        "https://raw.githubusercontent.com/GemeenteHMSBMD/cbs-data-heemstede-bloemendaal/main/WoningvoorraadHMS_GRAPH",
        options
      );
    </script>
  </body>
</html>
